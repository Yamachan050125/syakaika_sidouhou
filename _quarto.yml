project: 
  type: book
  output-dir: docs

lightbox: auto

book: 
  title: "社会科指導法"
  author: "とりけらとっぷす"
  chapters:
    - index.qmd
    - part: "社会科の基本"
      chapters: 
      - 1_mokuhyo.qmd
      - 2_churitsu.qmd
    - part: "単元構想と年間計画"
    - part: "授業の組み立て"
    - part: "アクティブ・ラーニングと協働学習の実践"
    - part: "ICT活用と資料探しのコツ"
    - part: "評価とフィードバック"
    - part: "付録"
    - references.qmd

format:
  html:
    theme: 
      - cosmo
    grid:
      sidebar-width: 375px
    number-sections: true
    code-line-numbers: true
    highlight-style: a11y
    html-math-method: mathjax
    toc: true
    toc-depth: 3
    link-external-newwindow: true

bibliography: tex/references.bib